name: Build

# Simplified docker image build (modeled on go2rtc's build workflow):
# - pushes to `master` publish ghcr.io/<owner>/frigate-dejavu:latest
# - tags `v*` publish the matching semver tags (v1.2.3 -> 1.2.3, 1.2, 1)
# - pull requests run quality checks and BUILD the image (nothing is pushed)
# No registry secrets needed: images go to GitHub's own registry (GHCR)
# using the workflow's built-in GITHUB_TOKEN.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - app/**
      - tests/**
      - Dockerfile
      - requirements.txt
      - config.example.yaml
      - compose.example.yaml
      - .github/workflows/build.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "ruff>=0.12,<1"

      - name: Check Python
        run: |
          python -m compileall -q app tests
          ruff check app tests
          python -m unittest discover -s tests -v

  docker:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + buildx: the image is pure Python + distro ffmpeg, so arm64
      # (Pi/NAS hosts) cross-builds cleanly alongside amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
