name: Build

# Simplified docker image build (modeled on go2rtc's build workflow):
# - pushes to `master` publish `latest` and an immutable `sha-*` tag
# - stable tags publish semver tags and update `latest`
#   (v1.2.3 -> latest, 1.2.3, 1.2, 1, sha-*); prereleases do not update latest
# - pull requests run quality checks and BUILD the image (nothing is pushed)
# No registry secrets needed: images go to GitHub's own registry (GHCR)
# using the workflow's built-in GITHUB_TOKEN.

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - app/**
      - tests/**
      - .dockerignore
      - Dockerfile
      - requirements.txt
      - ruff.toml
      - config.example.yaml
      - compose.example.yaml
      - .github/workflows/build.yml
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "ruff>=0.12,<1"

      - name: Check Python
        run: |
          python -m compileall -q app tests
          ruff check app tests
          python -m unittest discover -s tests -v

  docker:
    name: Build and push image
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU + buildx: the image is pure Python + distro ffmpeg, so arm64
      # (Pi/NAS hosts) cross-builds cleanly alongside amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: frigate-dejavu:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          docker run --detach --name frigate-dejavu-smoke \
            --publish 127.0.0.1:8898:8898 \
            --volume "$PWD/config.example.yaml:/config/config.yaml:ro" \
            --env DEJAVU_API_TOKEN= \
            --env DEJAVU_FRIGATE_USER= \
            --env DEJAVU_FRIGATE_PASSWORD= \
            frigate-dejavu:smoke
          trap 'docker rm --force frigate-dejavu-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8898/healthz >/dev/null; then
              docker exec frigate-dejavu-smoke python3 -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8898/healthz', timeout=3).read()"
              docker exec frigate-dejavu-smoke dejavu --help >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker logs frigate-dejavu-smoke
          exit 1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
