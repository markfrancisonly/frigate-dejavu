# ─────────────────────────────────────────────────────────────────────────────
# Frigate Déjà Vu — example Docker Compose
#
# Copy this to `compose.yaml`, then edit the lines marked EDIT — there are only
# two things to customize:
#   1. the host paths to your Frigate config + recordings dirs
#   2. the Docker network your Frigate container is on
# Then:   docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  frigate-dejavu:
    image: ghcr.io/markfrancisonly/frigate-dejavu:latest
    pull_policy: always
    container_name: frigate-dejavu
    restart: unless-stopped
    init: true                        # reap the short-lived ffmpeg children

    environment:
      TZ: Etc/UTC
      DEJAVU_CONFIG: /config/config.yaml
      DEJAVU_LOG_LEVEL: INFO
      DEJAVU_API_TOKEN: ""
      DEJAVU_FRIGATE_USER: ""
      DEJAVU_FRIGATE_PASSWORD: ""

    # Cap container-log growth.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    volumes:
      - ./config.yaml:/config/config.yaml:ro   # copy of config.example.yaml
      - ./data:/data                           # runtime state, logs, clip index

      # EDIT: Frigate's config/dejavu-clips directory (new), shared with go2rtc.
      - /path/to/frigate/config/dejavu-clips:/clips

      # EDIT: Frigate's recordings directory (existing); export handles missing segments.
      - /path/to/frigate/recordings:/recordings:ro

    ports:
      - "127.0.0.1:8898:8898"

    networks:
      - frigate-network

networks:
  frigate-network:
    name: frigate                    # EDIT: Frigate's external Docker network
    external: true
