# ─────────────────────────────────────────────────────────────────────────────
# Frigate Déjà Vu — example Docker Compose
#
# Copy this to `compose.yaml`, then edit the lines marked EDIT — there are only
# two things to customize:
#   1. the host paths to your Frigate config + recordings dirs
#   2. the Docker network your Frigate container is on
# Then:   docker compose up -d --build
#
# Your real `compose.yaml` is gitignored, so these edits never get committed.
# ─────────────────────────────────────────────────────────────────────────────

services:
  frigate-dejavu:
    build: .
    image: frigate-dejavu:local
    container_name: frigate-dejavu
    restart: unless-stopped
    init: true                       # reap the short-lived ffmpeg/curl children

    environment:
      - TZ=Etc/UTC                   # EDIT: your timezone (log timestamps only)
      # Optional REST bearer token; empty/unset disables API auth. Put the real
      # value in a gitignored `.env` file (see .env.example) — never inline here.
      - DEJAVU_API_TOKEN=${DEJAVU_API_TOKEN:-}
      - DEJAVU_LOG_LEVEL=${DEJAVU_LOG_LEVEL:-INFO}
      # Optional Frigate API credentials (authenticated :8971 port only; the
      # internal :5000 needs none) — set in the gitignored .env.
      - DEJAVU_FRIGATE_TOKEN=${DEJAVU_FRIGATE_TOKEN:-}
      - DEJAVU_FRIGATE_USER=${DEJAVU_FRIGATE_USER:-}
      - DEJAVU_FRIGATE_PASSWORD=${DEJAVU_FRIGATE_PASSWORD:-}

    # Cap container-log growth; set DEJAVU_LOG_LEVEL=DEBUG for full forensics.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    volumes:
      # This appliance's own files:
      - ./config.yaml:/config/config.yaml:ro   # copy of config.example.yaml
      - ./data:/data                           # runtime state, logs, clip index

      # EDIT: your Frigate CONFIG dir. The appliance writes replay clips into a
      # `dejavu-clips/` subfolder that Frigate's embedded go2rtc already serves,
      # so Frigate itself needs NO config change and NO restart.
      - /path/to/frigate/config/dejavu-clips:/clips

      # EDIT: your Frigate RECORDINGS dir (read-only). Loop windows are sourced
      # straight from these segment files.
      - /path/to/frigate/recordings:/recordings:ro

      # Only used when config.yaml sets `restart_method: docker`; the default
      # `api` path uses Frigate's own /api/restart and never touches the socket.
      # Delete this mount if you'd rather not grant Docker control.
      - /var/run/docker.sock:/var/run/docker.sock

    # INBOUND — how clients reach this appliance. Publishes the REST API so
    # Home Assistant / curl can hit http://<docker-host>:8898. Remove if you
    # only ever call it by container name from the same Docker network.
    ports:
      - "8898:8898"

    # OUTBOUND — how this appliance reaches Frigate. It resolves `frigate` to
    # call Frigate's API (:5000), go2rtc (:1984) and RTSP (:8554) — see the URLs
    # in config.yaml — so it must share a Docker network with your Frigate
    # container. Find that network with:
    #   docker inspect frigate -f '{{json .NetworkSettings.Networks}}'
    networks:
      - frigate

networks:
  # EDIT: replace `frigate` with the name of the network your Frigate container
  # is already on. `external: true` means Compose joins it rather than creating
  # a new one.
  frigate:
    external: true
